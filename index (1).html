<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta OMI – Aprendizaje del Robot Karel</title>
<style>
:root{--mr:#9b1c2e;--mr2:#c24a5a;--cr:#f7e9d7;--pk:#fdf3f3;--tx:#3a1a1f;--mut:#7a5a5f;--ok:#15803d;--bad:#b91c1c;--bd:#f0d5d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--cr);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;padding:14px}
.wrap{max-width:980px;margin:0 auto;background:var(--pk);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #9b1c2e22}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:800;color:var(--mr);cursor:pointer}
header nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pill{border:0;background:none;color:var(--mr);font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;text-decoration:none}
.pill.cta{background:var(--mr);color:#fff}
.hero{background:linear-gradient(120deg,var(--mr),var(--mr2));color:#fff;padding:28px 26px 70px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:relative}
.circ{width:150px;height:150px;border-radius:50%;background:#fff;border:6px solid #fff;display:grid;place-items:center;font-size:72px;box-shadow:0 6px 18px #0003;flex:none}
.hero h1{margin:0;font-size:clamp(26px,5vw,42px);line-height:1.1;text-transform:uppercase;letter-spacing:.5px}
.hero p{margin:6px 0 12px;font-size:18px;opacity:.95}
.badge{display:inline-block;background:#fff2;border:1px solid #fff6;border-radius:20px;padding:6px 16px;font-weight:700}
.bar{height:8px;background:#fff3;border-radius:9px;margin-top:12px;overflow:hidden;max-width:320px}.bar i{display:block;height:100%;background:#fff;width:0}
.panel{background:#fff;margin:-44px 18px 0;border-radius:20px;padding:20px;position:relative;box-shadow:0 4px 18px #9b1c2e14}
h2{color:var(--mr);margin:0 0 2px}.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--pk);border:1px solid var(--bd);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;position:relative;transition:.15s;font:inherit;color:var(--tx)}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 14px #9b1c2e1f}.card .e{font-size:34px}.card b{display:block;font-size:14px;margin-top:4px}.card small{color:var(--mut)}
.card.done{border-color:var(--ok)}.card.done:after{content:"✔";position:absolute;top:8px;right:10px;color:var(--ok);font-weight:800}
.promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:20px 24px}
.promise div{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;font-size:14px}.promise span{font-size:28px;display:block}
.ticket{margin:0 24px 20px;background:#fff;border:1px dashed var(--mr2);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ticket b{color:var(--mr);font-size:18px}
.btn{background:var(--mr);color:#fff;border:0;padding:10px 20px;border-radius:22px;cursor:pointer;font:inherit;font-weight:700}
.sec{padding:0 24px 24px}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tabs button{padding:8px 18px;border:1px solid var(--bd);background:#fff;border-radius:22px;cursor:pointer;font:inherit;color:var(--mr);font-weight:600}
.tabs button.on{background:var(--mr);color:#fff;border-color:var(--mr)}
.box{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px}
pre{background:#2b1418;color:#ffe8ea;padding:12px;border-radius:10px;overflow-x:auto;font-size:14px}
.q{margin:0 0 18px}.q p{font-weight:700;margin:0 0 6px}.q label{display:block;padding:7px 12px;border:1px solid var(--bd);border-radius:12px;margin:4px 0;cursor:pointer;background:var(--pk)}
.q.r label.c{border-color:var(--ok);background:#e8f6ec}.q.r label.w{border-color:var(--bad);background:#fdeaea}.ex{font-size:14px;color:var(--mut);margin-top:4px}
.nv{display:flex;justify-content:space-between;margin-top:16px}.nv button{background:#fff;border:1px solid var(--bd);color:var(--mr);padding:8px 16px;border-radius:22px;cursor:pointer;font:inherit;font-weight:600}
a{color:var(--mr)}.tag{display:inline-block;background:var(--pk);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.links div{background:var(--pk);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:14px}
.foot{background:var(--mr);color:#fff;margin:0 24px;border-radius:14px;padding:14px;text-align:center;font-weight:700}
footer{padding:16px 24px 22px;color:var(--mut);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}footer b{color:var(--mr);font-size:20px}
</style></head><body>
<div class="wrap">
<header><span class="logo" onclick="home()">🤖 Ruta OMI</span><nav><button class="pill" onclick="home()">Inicio</button><button class="pill" onclick="home();document.getElementById('temas').scrollIntoView()">Temas</button><a class="pill cta" href="https://plataforma.karelogic.net" target="_blank">Ir a Karelogic</a></nav></header>
<div id="app"></div>
<div class="foot">Ruta OMI – Aprende Robot Karel paso a paso, practica y evalúa lo aprendido</div>
<footer><div><b>Ruta OMI</b><br>Seminario de Computación · FCFM UANL</div><div>Ejercicios: DMOJ y OmegaUp<br>Simulador: plataforma.karelogic.net</div></footer>
</div>
<script>
const L="https://plataforma.karelogic.net";
const S=[
["Plataforma y simulador","Karelogic se organiza en <b>unidades → lecciones → ejemplos y ejercicios</b> (unidades 0-4: Karel; 5: C/C++; 10: programación competitiva). El simulador tiene 5 áreas: <b>1</b> botones (Reiniciar, Compilar, Ejecutar, Siguiente, Enviar y Mochila), <b>2</b> descripción, <b>3</b> código y Mensajes de Karel, <b>4</b> herramientas y <b>5</b> el mundo. Flujo: <b>Compilar → Ejecutar/Siguiente → Reiniciar → Enviar</b>. Mochila = -1 significa zumbadores infinitos. Las <b>calles (X)</b> son verticales, las <b>avenidas (Y)</b> horizontales; las coordenadas se escriben (calle, avenida) y Karel suele iniciar en (1,1).","class program {\n  program() {\n    move();\n    turnoff();\n  }\n}",["Karel en la calle 5 y avenida 6: ¿cuáles son sus coordenadas?","¿Qué recorre el botón Siguiente?","Mochila con -1 significa…"],[["¿Qué botón sube tu calificación a la plataforma?",["Compilar","Enviar","Reiniciar"],1,"Enviar califica y sube tu resultado."],["Antes de Ejecutar o Siguiente, el código debe…",["Estar compilado sin errores","Estar guardado","Tener comentarios"],0,"Y para repetir debes presionar Reiniciar."],["Las coordenadas se escriben como…",["(avenida, calle)","(calle, avenida)","(fila, columna)"],1,"Primero X (calle), luego Y (avenida)."]]],
["Instrucciones básicas","<b>move()</b> avanza una cuadra; <b>turnleft()</b> gira 90° a la izquierda (no hay giro a la derecha: usa 3 turnleft); <b>pickbeeper()</b> levanta un zumbador a la mochila (error si no hay); <b>putbeeper()</b> deja uno (error si la mochila está vacía); <b>turnoff()</b> apaga a Karel.","class program {\n  program() {\n    move();\n    pickbeeper();\n    turnleft();\n    turnoff();\n  }\n}",["Karel mira al Norte: haz que quede viendo al Este.","Avanza una cuadra y levanta el zumbador."],[["Karel mira al Norte; tras 2 turnleft() mira al…",["Sur","Este","Oeste"],0,"Dos giros de 90° = 180°."],["¿Qué pasa con pickbeeper() sin zumbador?",["Nada","Error y se detiene","Pone uno"],1,"Se genera un error."],["Para girar a la derecha usas…",["turnright()","3 turnleft()","back()"],1,"Karel solo gira a la izquierda."]]],
["El iterate","<b>iterate(n)</b> repite n veces las instrucciones de su bloque. Útil para recorrer muchas calles o levantar muchos zumbadores.","iterate(5) {\n  putbeeper();\n  move();\n}",["Avanzar 3 cuadras al Norte (termina en (1,4)).","Levantar los 3 zumbadores de su esquina.","Colocar 4 zumbadores en su esquina.","Girar de Norte a Este (iterate(3) con turnleft).","Avanzar 5 cuadras dejando un zumbador en cada una."],[["¿Cuántas veces corre iterate(3){move();}?",["2","3","4"],1,"n = 3."],["Para pasar de Norte a Este con iterate necesitas…",["iterate(3){turnleft();}","iterate(1){turnleft();}","iterate(2){turnleft();}"],0,"Tres giros a la izquierda = derecha."]]],
["El iterate anidado","Un iterate dentro de otro: el interno se ejecuta completo en cada vuelta del externo. Sirve para figuras como cuadrados o escaleras.","iterate(4) {\n  iterate(3) {\n    move();\n  }\n  turnleft();\n}",["Dibuja un cuadrado de lado 4 con zumbadores.","Haz una escalera de 3 escalones."],[["¿Cuántos move() ejecuta iterate(2){iterate(3){move();}}?",["5","6","3"],1,"2 × 3 = 6."],["En iterate(4){iterate(3){move();} turnleft();} Karel traza…",["Un cuadrado (lado 3 aprox.)","Una línea","Nada"],0,"Avanza y gira 4 veces."]]],
["Sensores de Karel","Funciones booleanas (verdadero/falso). <b>Zumbadores:</b> nextToABeeper(), notNextToABeeper(), anyBeepersInBeeperBag(), notAnyBeepersInBeeperBag(). <b>Paredes (media cuadra):</b> frontIsClear(), frontIsBlocked(), leftIsClear(), leftIsBlocked(), rightIsClear(), rightIsBlocked(). <b>Orientación:</b> facingNorth/South/East/West() y notFacingNorth/South/East/West().","if (frontIsClear()) {\n  move();\n}",["Karel mira al Norte con pared al frente y a la derecha: ¿cuánto valen frontIsClear() y leftIsClear()?","Karel sobre 3 zumbadores y mochila vacía: ¿nextToABeeper()?"],[["Karel sobre un zumbador: nextToABeeper() es…",["Falso","Verdadero","Error"],1,"Está sobre un zumbador."],["Karel con 10 zumbadores en la mochila: anyBeepersInBeeperBag() es…",["Verdadero","Falso","Depende"],0,"Hay al menos uno."],["Karel mira al Sur: facingSouth() es…",["Verdadero","Falso","Error"],0,"Orientado al Sur."]]],
["El if y el if-else","<b>if(condición){...}</b> ejecuta el bloque solo si la condición es verdadera. <b>else{...}</b> se ejecuta si es falsa; no puede usarse sin un if.","iterate(10) {\n  if (nextToABeeper()) {\n    pickbeeper();\n    move();\n  } else {\n    move();\n  }\n}\nturnoff();",["Karel cartero: recoge la carta de cada buzón en una calle de 10 casas.","Avanza 3 cuadras y levanta un zumbador si lo encuentra."],[["¿Cuándo corre el else?",["Si la condición es falsa","Siempre","Si es verdadera"],0,"Es el caso contrario."],["¿else puede usarse solo?",["Sí","No, complementa a un if","Solo en funciones"],1,"Siempre acompaña a un if."]]],
["El while","<b>while(condición){...}</b> repite MIENTRAS la condición sea verdadera. Ideal cuando no conoces cuántas veces repetir.","while (frontIsClear()) {\n  move();\n  putbeeper();\n}\nturnoff();",["Camina dejando zumbadores hasta encontrar una pared.","Avanza hasta la pared y recoge todos los zumbadores del camino."],[["¿Hasta cuándo repite el while?",["n veces fijas","Mientras la condición sea verdadera","Una vez"],1,"Revisa la condición en cada vuelta."],["while(frontIsClear()){move();} termina cuando…",["Hay pared al frente","Hay zumbador","Siempre"],0,"frontIsClear() pasa a falso."]]],
["Funciones sin parámetro","Define tus propias instrucciones con <b>void nombre()</b> y colócalas dentro de class program, antes de program(). Evitan repetir código.","class program {\n  void turnright() {\n    iterate(3) {\n      turnleft();\n    }\n  }\n  program() {\n    turnright();\n    move();\n    turnoff();\n  }\n}",["Crea turnright() y úsala para rodear una pared.","Crea una función que deje un zumbador y avance."],[["¿Dónde se declaran las funciones?",["Dentro de class program, fuera de program()","Después de turnoff()","En la pestaña Herramientas"],0,"Como el void mideLaDistancia() del manual."],["void indica que la función…",["No devuelve valor","Devuelve un número","Es recursiva"],0,"Solo ejecuta instrucciones."]]],
["Funciones con parámetro","Una función puede recibir un número: <b>void avanza(n)</b>. Se llama con avanza(5). Dentro, n se usa por ejemplo en iterate(n).","class program {\n  void avanza(n) {\n    iterate(n) {\n      move();\n    }\n  }\n  program() {\n    avanza(5);\n    turnoff();\n  }\n}",["Crea avanza(n) y úsala para llegar a (1,6).","Crea ponZumbadores(n)."],[["¿Qué hace avanza(5)?",["Avanza 5 cuadras","Avanza 1","Gira 5 veces"],0,"n vale 5 en el iterate."],["n es un…",["Parámetro","Sensor","Zumbador"],0,"Valor que recibe la función."]]],
["El while anidado","Un while dentro de otro (o dentro de un iterate): por ejemplo recorrer una calle y, en cada esquina, vaciar todos sus zumbadores.","while (frontIsClear()) {\n  while (nextToABeeper()) {\n    pickbeeper();\n  }\n  move();\n}",["Recoge todos los zumbadores de cada esquina de una calle.","Recorre filas hasta la pared."],[["El while interno corre…",["Completo en cada vuelta del externo","Solo una vez","Nunca"],0,"Igual que el iterate anidado."],["Si cada esquina puede tener varios zumbadores usas…",["while(nextToABeeper())","if(nextToABeeper())","iterate(1)"],0,"El if recoge solo uno."]]],
["Recursividad simple","Una función que se llama a sí misma. Cada llamada carga una nueva copia y la anterior queda pendiente; al terminar, regresa donde están los asteriscos. Casi siempre es un proceso de <b>conteo</b> y suele usarse con zumbadores infinitos. El caso base (el else o el if que ya no se cumple) detiene la cadena.","void mideLaDistancia() {\n  if (frontIsClear()) {\n    move();\n    mideLaDistancia();\n    putbeeper();\n  }\n}\n// program(){ mideLaDistancia(); turnoff(); }",["Karel al Este con barda de frente: deja junto a la barda tantos zumbadores como cuadras recorrió.","Igual, pero deja el resultado una cuadra al Norte de la barda.","Barda a su izquierda: cuenta las celdas y deja el resultado una cuadra al Este."],[["¿Qué detiene la recursión?",["El caso base (cuando el if ya no se cumple)","turnoff() dentro","Nada"],0,"En la última copia la condición es falsa."],["La recursión se parece a…",["while","iterate fijo","un sensor"],0,"Repite hasta que deja de cumplirse algo."]]],
["Recursividad con parámetro","El parámetro sirve de contador con <b>succ(n)</b> (n+1), <b>pred(n)</b> (n-1) e <b>iszero(n)</b> (¿n es 0?). Se llama a sí misma con pred(n) hasta llegar a cero. (Verifica la sintaxis exacta en la lección correspondiente de Karelogic.)","void avanza(n) {\n  if (!iszero(n)) {\n    move();\n    avanza(pred(n));\n  }\n}\n// avanza(5);",["Avanza n cuadras con recursividad.","Pon n zumbadores en línea recursivamente."],[["pred(n) devuelve…",["n-1","n+1","0"],0,"pred = predecesor."],["succ(n) devuelve…",["n+1","n-1","n"],0,"succ = sucesor."],["iszero(n) sirve para…",["Saber si n llegó a 0 (caso base)","Girar","Contar paredes"],0,"Detiene la recursión."]]],
["Recursividad anidada","Una función recursiva que usa otras funciones recursivas: por ejemplo, una recursiva que recorre una fila y otra que repite filas hacia arriba. Cada nivel tiene su propio caso base.","void fila() {\n  if (frontIsClear()) {\n    putbeeper(); move(); fila();\n  } else { putbeeper(); }\n}\nvoid vuelve() {\n  if (frontIsClear()) { move(); vuelve(); }\n}\nvoid cuadro() {\n  fila();\n  turnleft(); turnleft();\n  vuelve();\n  iterate(3) { turnleft(); }\n  if (frontIsClear()) {\n    move();\n    iterate(3) { turnleft(); }\n    cuadro();\n  }\n}",["Rellena con zumbadores un mundo rectangular fila por fila."],[["Cada función recursiva debe tener…",["Su propio caso base","Un while","Un iterate"],0,"Si no, se cicla."],["En cuadro(), fila() y vuelve() son…",["Funciones recursivas llamadas desde otra","Sensores","Parámetros"],0,"Recursividad anidada."]]]
];
const PASS=0.7,EM=["🧭","🧱","🔁","🔂","📡","🔀","➰","🧩","🎯","♾️","🪞","🔢","🌀"];
const V={0:[["▶ Video tutorial: cómo navegar y trabajar en Karelogic","https://youtu.be/HC6PyiE17KE"]],10:[["▶ Video: recursividad en Karel (del manual)","https://drive.google.com/file/d/1FuvAZTiYx9EiChMyOaQ8nHm8vmhVWtxp/view"]]};
let P={},B={},cur=-1,tab="a";
try{P=JSON.parse(localStorage.getItem("omi")||"{}");B=JSON.parse(localStorage.getItem("omib")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("omi",JSON.stringify(P));localStorage.setItem("omib",JSON.stringify(B))}catch(e){}};
const nextPend=()=>{const i=S.findIndex((_,k)=>!P[k]);return i};
const $=id=>document.getElementById(id);
const nOk=()=>S.filter((_,i)=>P[i]).length;
function hero(big,t,sub){const n=nOk();return `<div class="hero"><div class="circ">${big}</div><div><h1>${t}</h1><p>${sub}</p><span class="badge">${n} de ${S.length} secciones aprobadas · ${Math.round(n/S.length*100)}%</span><div class="bar"><i style="width:${n/S.length*100}%"></i></div></div></div>`}
function home(){cur=-1;window.scrollTo(0,0);$("app").innerHTML=hero("🤖","¡Domina al Robot Karel!","Aprende, practica y evalúa tu avance rumbo a la OMI")+
`<div class="panel" id="temas"><h2>Temas</h2><p class="sub">¿Qué quieres aprender hoy?</p><div class="grid">${S.map((s,i)=>`<button class="card ${P[i]?'done':''}" onclick="go(${i})"><span class="e">${EM[i]}</span><b>${i+1}. ${s[0]}</b><small>${B[i]!=null?(P[i]?'✔ Aprobado · ':'Último intento · ')+B[i]+'/10':'Pendiente'}</small></button>`).join("")}</div></div>
<h2 style="padding:22px 24px 0">Cómo funciona</h2><p class="sub" style="padding:0 24px">Una ruta clara en cada tema</p>
<div class="promise" style="padding-top:0"><div><span>📖</span>Aprender: teoría y código</div><div><span>💻</span>Practicar: ejercicios reales</div><div><span>✅</span>Quiz calificado, aprueba con 7/10</div><div><span>💾</span>Progreso guardado en tu navegador</div></div>
<div class="ticket"><span style="font-size:40px">🎫</span><div style="flex:1"><b>${nextPend()<0?"¡Ruta completada! 🎉":"Continúa donde vas"}</b><br>${nextPend()<0?"Aprobaste las "+S.length+" secciones.":"Siguiente tema: "+(nextPend()+1)+". "+S[nextPend()][0]}</div>${nextPend()<0?"":`<button class="btn" onclick="go(${nextPend()})">Continuar</button>`}</div>`}
function go(i,t){cur=i;tab=t||"a";window.scrollTo(0,0);render()}
function render(){const s=S[cur];let h=hero(EM[cur],`${cur+1}. ${s[0]}`,"Aprende · Practica · Evalúa")+`<div class="panel"><div class="tabs">${[["a","📖 Aprender"],["p","💻 Practicar"],["q","📝 Quiz"]].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div><div class="box">`;
if(tab=="a")h+=`<p>${s[1]}</p><pre>${s[2]}</pre>${(V[cur]||[]).map(v=>`<p><a class="btn" style="text-decoration:none;display:inline-block" href="${v[1]}" target="_blank">${v[0]}</a></p>`).join("")}<p>Practica este tema en <a href="${L}" target="_blank">plataforma.karelogic.net</a>.</p>`;
else if(tab=="p")h+=`<p><b>Ejercicios del manual</b> para <span class="tag">${s[0]}</span> (resuélvelos en el <a href="${L}" target="_blank">evaluador</a>):</p><ol>${s[3].map(e=>`<li>${e}</li>`).join("")}</ol><p>Más práctica con problemas reales:</p><div class="links"><div><b>Olimpiada de Informática (DMOJ)</b><br><a href="https://dmoj.olimpiadadeinformatica.org.mx" target="_blank">Abrir →</a></div><div><b>OmegaUp</b><br><a href="https://omegaup.com" target="_blank">Abrir →</a></div></div>`;
else h+=quiz(s);
h+=`</div><div class="nv"><button onclick="cur>0?go(cur-1,tab):home()">← Anterior</button><button onclick="home()">Todos los temas</button><button onclick="cur<S.length-1?go(cur+1,tab):home()">Siguiente →</button></div></div><div style="height:22px"></div>`;
$("app").innerHTML=h}
function quiz(s){return s[4].map((q,i)=>`<div class="q" id="q${i}"><p>${i+1}. ${q[0]}</p>${q[1].map((o,j)=>`<label><input type="radio" name="r${i}" value="${j}"> ${o}</label>`).join("")}<div class="ex"></div></div>`).join("")+`<button class="btn" onclick="grade()">Calificar</button><p id="res"></p>`}
function grade(){const s=S[cur];let ok=0;s[4].forEach((q,i)=>{const el=$("q"+i),v=el.querySelector("input:checked");el.classList.add("r");el.querySelectorAll("label").forEach((l,j)=>{if(j==q[2])l.classList.add("c");else if(v&&+v.value==j)l.classList.add("w")});
const g=v&&+v.value==q[2];if(g)ok++;el.querySelector(".ex").textContent=(g?"✔ Correcto. ":"✘ Incorrecto. ")+q[3]});
const n=s[4].length,pass=ok/n>=PASS;if(pass)P[cur]=1;const sc=Math.round(ok/n*10);if(B[cur]==null||sc>B[cur]||pass&&!P[cur])B[cur]=Math.max(sc,B[cur]||0);save();if(pass)document.querySelector(".bar i").style.width=nOk()/S.length*100+"%"
$("res").innerHTML=`<b>Calificación: ${ok}/${n} (${Math.round(ok/n*10)}/10)</b> — ${pass?'✅ Sección aprobada':'Necesitas al menos 7/10 para aprobar. ¡Inténtalo de nuevo!'}`}
home();
</script></body></html>
